# Modelo de potência por modo — docs/experimentacao.md §6 e docs/projeto/main.tex (Tab. pot)
# Potências em watts, na entrada de 5 V de cada placa. [nominal, min, max].
version = "1.6"

[SBC]   # Raspberry Pi Zero 2 W — potência TOTAL da placa a 5 V
scope = "board"
idle     = [0.60, 0.50, 1.00]   # ~120 mA (CNX Software 2021; Geerling 2021 ~100 mA)
active_1 = [1.00, 0.75, 1.30]   # 1 núcleo ativo, ~200 mA (Geerling 2021, cores desabilitados)
active_4 = [2.30, 1.85, 2.90]   # 4 núcleos, ~460 mA (Geerling 2021); 580 mA (Tom's Hardware 2021)
# modo por fase: pré/pós rodam em 1 thread; Invoke usa `threads` (interpolação linear 1..4)
pre  = "active_1"
inf  = "by_threads"
post = "active_1"

[MCU]   # ESP32-S3 (Xtensa LX7) @240 MHz, rádio desligado — potência na ENTRADA DE 5 V DA PLACA (mesmo escopo do SBC)
# Corrente do chip: ESP32-S3 Series Datasheet v2.2, Tab. 5-9 (Modem-sleep, 240 MHz, 3,3 V, 25 °C).
#   ativo  : um núcleo com instruções de 128 bits, outro ocioso (TFLM single-thread + ESP-NN/PIE)
#            nominal = 87,9 mA (periféricos ligados) x 5 V  -> placa com regulador linear (LDO): I_in ~ I_chip
#            mínimo  = 72,4 mA (periféricos desligados) x 3,3 V -> regulador chaveado ideal (sem perda de conversão)
#            máximo  = 107,9 mA (dois núcleos, 128 bits) x 5 V
#   ocioso : WAITI, 240 MHz: nominal/máx 47,6 mA x 5 V; mínimo 32,9 mA x 3,3 V
scope = "board_5V"
active = [0.440, 0.239, 0.540]
idle   = [0.238, 0.109, 0.238]
# Acréscimo da placa além do chip: PSRAM octal (o datasheet avisa que variantes com PSRAM consomem mais),
# flash (~10 mA), ponte USB, LED, corrente quiescente do regulador — parâmetro declarado
board_overhead = [0.0, 0.0, 0.25]
pre  = "active"
inf  = "active"
post = "active"
